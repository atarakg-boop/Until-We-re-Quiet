<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חוט</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #efe6d6; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #efe6d6;
           color: #3a3836; font-size: clamp(18px, 2vw, 30px); font-weight: 300; cursor: pointer; }
  #debug { position: fixed; left: 16px; bottom: 16px; padding: 8px 10px; border-radius: 6px; background: rgba(239,230,214,.9);
           color: #3a3836; font: 12px/1.5 monospace; direction: ltr; white-space: pre; display: none; }
  body.run { cursor: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start">לחיצה כדי להתחיל</div>
<div id="debug"></div>

<script>
// ================= הגדרות =================
const params = new URLSearchParams(location.search);
const PACE = +(params.get('pace') || 1);     // 0.5 = הציפורים מגיעות פי 2 מהר יותר. שימושי להגשה.
let OFFSET = +(params.get('offset') || 0);   // הזזה של כל הספים בדציבלים, אם החדר רועש מדי או שקט מדי
// כמה דציבלים מעל רעש הרקע של החדר נחשבים:
const T_SMALL = 6;    // רעש קטן: השקט נעצר, שום דבר לא צומח
const T_MED = 12;     // רעש בינוני: השקט נחתך בחצי, הנדירות עפות
const T_LOUD = 20;    // רעש חזק: השקט מתאפס, כולן עפות
const VOICE_GATE = 6; // בזמן שציפור שרה מהרמקולים, הספים עולים כדי שהמיקרופון לא "ישמע" אותה כרעש
const CAL_SECONDS = 3;
const PAPER = '#efe6d6', WIRE = '#3a3836', INK = '#2b2826';

// ================= קנבס =================
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let W, H, U;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  U = Math.min(W / 1250, H / 640);   // יחידת גודל של ציפור
}
resize(); addEventListener('resize', resize);

// ================= חוט =================
const wire = { base: .52, sag: .05, amp: 0, vel: 0 };
function wireY(x) { const u = x / W * 2 - 1; return H * wire.base + H * wire.sag * (1 - u * u) + wire.amp * Math.sin(Math.PI * x / W); }
function kickWire(v) { wire.vel += v; }
function updateWire(dt) { wire.vel += (-70 * wire.amp - 2.5 * wire.vel) * dt; wire.amp += wire.vel * dt; }

// ================= צורות =================
const poly = (pts, c) => { ctx.fillStyle = c; ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill(); };
const ell = (x, y, rx, ry, rot, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fill(); };
const circ = (x, y, r, c) => ell(x, y, r, r, 0, c);
const seg = (x1, y1, x2, y2, w, c) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
// מקור שנפתח כשהציפור שרה
function beak(s, x, y, len, half, c) {
  const o = s.open;
  poly([[x, y - half], [x - len, y - o], [x, y]], c);
  poly([[x, y], [x - len * .9, y + o], [x, y + half]], c);
}
// כרבולת הדוכיפת: open בין 0 (סגורה לאחור) ל-1 (פתוחה כמניפה)
function crest(open) {
  const B = [-22, -45], OPEN = [-125, -105, -85, -65, -45], SHUT = [-14, -10, -6, -2, 2];
  OPEN.forEach((a1, i) => {
    const a = (SHUT[i] + (a1 - SHUT[i]) * open) * Math.PI / 180, L = 17 + 7 * open;
    const d = [Math.cos(a), Math.sin(a)], p = [-d[1], d[0]], T = [B[0] + d[0] * L, B[1] + d[1] * L];
    poly([[B[0] + p[0] * 3, B[1] + p[1] * 3], [B[0] - p[0] * 3, B[1] - p[1] * 3], T], '#d99a6c');
    const Tb = [T[0] - d[0] * L * .22, T[1] - d[1] * L * .22], w = 3 * .22;
    poly([T, [Tb[0] + p[0] * w, Tb[1] + p[1] * w], [Tb[0] - p[0] * w, Tb[1] - p[1] * w]], '#232323');
  });
}

// ================= המינים =================
// כל ציפור מצוירת כשהיא פונה שמאלה, כפות הרגליים ב-(0,0), y שלילי = למעלה.
// every: כל כמה שניות היא שרה (מינימום, מקסימום)
const DEF_LEGS = [[-2, -7, -3, 0], [5, -7, 5, 0]];
const SPECIES = {
  sparrow: { name: 'דרור', size: 1, pivot: [2, -28], every: [3, 7],
    tail: () => poly([[18, -14], [40, -4], [36, 4], [14, -8]], '#6b4f3a'),
    body: () => { ell(4, -20, 22, 15, .25, '#b08866'); ell(-2, -14, 14, 9, .2, '#e3d6c2'); },
    wing: () => { poly([[-4, -28], [20, -30], [28, -14], [4, -14]], '#7a5a40'); poly([[4, -26], [10, -27], [16, -16], [10, -16]], '#e3d6c2'); },
    head: s => {
      circ(-16, -34, 11, '#b08866');
      ctx.fillStyle = '#7d7873'; ctx.beginPath(); ctx.arc(-16, -34, 11, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); ctx.fill();
      poly([[-25, -29], [-14, -26], [-16, -18], [-23, -22]], '#2a2624');
      beak(s, -26, -34, 9, 3.2, '#3a3330'); circ(-20, -36, 1.8, INK);
    } },
  bulbul: { name: 'בולבול', size: 1.05, pivot: [2, -30], every: [5, 10],
    tail: () => poly([[16, -14], [42, 0], [36, 6], [12, -8]], '#6f6458'),
    body: () => { ell(4, -22, 24, 15, .25, '#8e8273'); ell(-2, -15, 15, 9, .2, '#cbc2b4'); ell(15, -11, 7, 4, .3, '#e5c03a'); },
    wing: () => poly([[-4, -30], [22, -31], [30, -15], [4, -15]], '#74695d'),
    head: s => {
      poly([[-14, -47], [-7, -43], [-16, -41]], '#2b2826'); circ(-16, -36, 12, '#2b2826');
      beak(s, -27, -36, 9, 3, '#2b2826'); circ(-20, -38, 3.2, '#f2eee6'); circ(-20, -38, 1.6, INK);
    } },
  sunbird: { name: 'צופית', size: .85, pivot: [0, -24], every: [6, 12],
    tail: () => poly([[14, -12], [34, -2], [30, 4], [10, -7]], '#1e2433'),
    body: () => ell(3, -18, 18, 12, .25, '#232a3d'),
    wing: () => { poly([[-4, -24], [16, -25], [22, -12], [2, -12]], '#2e3a52'); ell(-1, -23, 3.5, 2.2, 0, '#e08a2e'); },
    head: s => {
      circ(-13, -28, 9, '#1f4a7a');
      ctx.strokeStyle = '#14161c'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-21, -29 + s.open * .5); ctx.quadraticCurveTo(-31, -30, -37, -20); ctx.stroke();
      circ(-16, -30, 1.6, '#0d0f14');
    } },
  hoopoe: { name: 'דוכיפת', size: 1.1, pivot: [-2, -29], every: [4, 8], legs: [[-3.5, -9, -4.5, 0], [5, -7.5, 5, 0]],
    tail: () => { poly([[20, -19], [50, 9], [42, 15.5], [13, -13]], '#232323'); poly([[31, -8], [35.5, -4], [29.5, 2], [25, -2]], '#f7f2e8'); },
    body: () => ell(0, -22, 26, 15, .35, '#d99a6c'),
    wing: () => {
      poly([[-13.5, -30], [21.5, -33], [33, -15], [0, -13]], '#232323');
      poly([[-3.5, -29.5], [0, -29.5], [10, -13.5], [6.5, -13.5]], '#f7f2e8');
      poly([[6.5, -31], [10, -31], [20, -14], [16.5, -14]], '#f7f2e8');
      poly([[16.5, -32], [20, -32], [29, -15], [25.5, -14.5]], '#f7f2e8');
    },
    head: s => {
      crest(s.crest); circ(-25, -37, 10.5, '#d99a6c');
      ctx.strokeStyle = '#232323'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-34, -34.5); ctx.quadraticCurveTo(-48, -30, -58, -19); ctx.stroke();
      circ(-28.5, -39, 1.5, '#232323');
    } },
  kingfisher: { name: 'שלדג', size: 1.1, pivot: [2, -31], every: [8, 14],
    tail: () => poly([[16, -16], [38, -2], [32, 3], [12, -10]], '#2a8fb0'),
    body: () => ell(2, -22, 22, 15, .3, '#8a4a2a'),
    wing: () => { poly([[-6, -32], [20, -33], [28, -14], [2, -14]], '#2fa3c4'); poly([[12, -26], [28, -14], [18, -13]], '#1d3e5c'); },
    head: s => {
      circ(-15, -36, 12, '#7a3f22'); poly([[-23, -30], [-10, -28], [-9, -19], [-19, -21]], '#f4efe6');
      beak(s, -24, -36, 26, 4.5, '#c9372c'); circ(-17, -39, 2, INK);
    } },
};

function drawBird(b) {
  const sp = SPECIES[b.sp];
  ctx.save();
  ctx.translate(b.x, b.y); ctx.scale(U * sp.size * b.face, U * sp.size); ctx.rotate(b.tilt);
  if (b.state === 'perched' || (b.state === 'fleeing' && b.delay > 0)) (sp.legs || DEF_LEGS).forEach(l => seg(l[0], l[1], l[2], l[3], 1.6, INK));
  sp.tail(); sp.body();
  ctx.save(); ctx.translate(sp.pivot[0], sp.pivot[1]); ctx.rotate(b.flap); ctx.translate(-sp.pivot[0], -sp.pivot[1]); sp.wing(); ctx.restore();
  ctx.save(); ctx.translate(0, -b.sing * 1.5); sp.head({ open: b.sing * 2.2, crest: b.crest }); ctx.restore();
  ctx.restore();
}

// ================= הלהקה =================
// מין, אחרי כמה שניות של שקט רצוף הוא מגיע, ומקום על החוט. הנפוצות מגיעות קודם, הביישניות אחרונות.
const SLOTS = Array.from({ length: 12 }, (_, i) => .1 + i * .8 / 11);
const ROSTER = [
  ['sparrow', 4, 5], ['sparrow', 8, 7], ['sparrow', 12, 4], ['bulbul', 18, 8], ['bulbul', 26, 3], ['sparrow', 34, 9],
  ['sunbird', 42, 1], ['sunbird', 52, 10], ['bulbul', 62, 6], ['hoopoe', 80, 2], ['sunbird', 95, 11], ['kingfisher', 120, 0],
];
const birds = ROSTER.map(([sp, arrive, slot]) => ({ sp, arrive, slot: SLOTS[slot], state: 'gone', x: -999, y: -999, face: 1, tilt: 0, flap: 0,
  sing: 0, crest: 0, crestPulse: 0, songEnd: 0, nextSing: 0, nextTurn: 0, delay: 0, ph: Math.random() * 9 }));

function startArrive(b) {
  const tx = b.slot * W, ty = wireY(tx), side = Math.random() < .5 ? -1 : 1;
  b.fx = tx + side * W * (.35 + Math.random() * .3); b.fy = -.12 * H;
  b.cx = tx + (b.fx - tx) * .35; b.cy = ty - .28 * H;
  b.p = 0; b.dur = 1.6 + Math.random() * .6; b.face = b.fx > tx ? 1 : -1; b.state = 'arriving';
}
function startFlee(b, delay) {
  b.onWire = b.state === 'perched'; b.state = 'fleeing'; b.delay = b.onWire ? delay : 0; b.launched = false;
}
function updateBird(b, dt, now) {
  const sp = SPECIES[b.sp];
  if (b.state === 'arriving') {
    b.p += dt / b.dur; const p = Math.min(1, b.p), e = 1 - (1 - p) * (1 - p);
    const tx = b.slot * W, ty = wireY(tx) - 1;
    b.x = (1 - e) ** 2 * b.fx + 2 * (1 - e) * e * b.cx + e * e * tx;
    b.y = (1 - e) ** 2 * b.fy + 2 * (1 - e) * e * b.cy + e * e * ty;
    b.flap = p < .75 ? Math.sin(now * 26 + b.ph) * .8 - .3 : -1 + (p - .75) * 2;
    b.tilt = p < .75 ? -.15 : 0;
    if (p >= 1) {
      b.state = 'perched'; b.flap = 0; b.tilt = 0; kickWire(22 * U * sp.size);
      b.nextSing = 1 + Math.random() * 2.5; b.crestPulse = 1.2; b.nextTurn = 5 + Math.random() * 10;
    }
  } else if (b.state === 'perched') {
    b.x = b.slot * W; b.y = wireY(b.x) - 1;
    if ((b.nextTurn -= dt) <= 0) { b.face *= -1; b.nextTurn = 6 + Math.random() * 12; }
    const singing = now < b.songEnd;
    b.sing += ((singing ? .6 + .4 * Math.abs(Math.sin(now * 18 + b.ph)) : 0) - b.sing) * Math.min(1, dt * 12);
    if (!singing && (b.nextSing -= dt) <= 0) {
      if (audio.ac && voices(now) < 4) play(b, now);
      b.nextSing = sp.every[0] + Math.random() * (sp.every[1] - sp.every[0]);
    }
    b.crestPulse = Math.max(0, b.crestPulse - dt);
  } else if (b.state === 'fleeing') {
    if (b.delay > 0) { b.delay -= dt; b.x = b.slot * W; b.y = wireY(b.x) - 1; return; }
    if (!b.launched) {
      b.launched = true; flutter(b.x); hush(b); b.sing = 0;
      if (b.onWire) kickWire(-16 * U * sp.size);
      const dir = b.x < W / 2 ? -1 : 1;
      b.vx = dir * (160 + Math.random() * 160) * U; b.vy = -(220 + Math.random() * 160) * U; b.face = b.vx < 0 ? 1 : -1;
    }
    b.vy -= 120 * U * dt; b.vx *= 1 + dt * .6; b.x += b.vx * dt; b.y += b.vy * dt;
    b.flap = Math.sin(now * 34 + b.ph) * .9 - .35; b.tilt = -.25;
    if (b.y < -80 * U || b.x < -120 * U || b.x > W + 120 * U) b.state = 'gone';
  }
  const crestTarget = (b.state === 'perched' && (b.sing > .1 || b.crestPulse > 0)) ? 1 : 0;
  b.crest += (crestTarget - b.crest) * Math.min(1, dt * 8);
}

// ================= צליל =================
const audio = { ac: null, master: null, noise: null, files: {}, voicesUntil: 0 };
const voices = now => birds.filter(b => b.songEnd > now).length;
const clockNow = () => performance.now() / 1000;

function tone(dest, t, f0, f1, d, vol = .25, type = 'sine') {
  const ac = audio.ac, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + Math.min(.015, d / 3)); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g).connect(dest); o.start(t); o.stop(t + d + .02);
}
// קולות מסונתזים זמניים, למינים שאין להם עדיין הקלטה.
// הקלטות אמיתיות: birds/<מין>.mp3 או כמה גרסאות birds/<מין>-1.mp3 עד -6. כל פעם נבחרת אחת באקראי.
// רחש כנפיים בהמראה: birds/wings-1.mp3 עד -6.
const SONGS = {
  sparrow: (t, d) => { const n = 2 + (Math.random() * 3 | 0); for (let i = 0; i < n; i++) tone(d, t + i * .16, 4300 + Math.random() * 400, 2900, .08, .18); return n * .16; },
  bulbul: (t, d) => {
    const notes = [1500, 1950, 2350, 1750, 2650, 2100], n = 4 + (Math.random() * 2 | 0); let tt = t;
    for (let i = 0; i < n; i++) { const f = notes[Math.random() * notes.length | 0], len = .1 + Math.random() * .12; tone(d, tt, f, f * (.9 + Math.random() * .25), len, .22); tt += len + .04; }
    return tt - t;
  },
  sunbird: (t, d) => { const n = 12 + (Math.random() * 8 | 0); for (let i = 0; i < n; i++) tone(d, t + i * .045, i % 2 ? 4700 : 5400, i % 2 ? 4500 : 5100, .035, .1); return n * .045; },
  hoopoe: (t, d) => { for (let i = 0; i < 3; i++) tone(d, t + i * .34, 500, 430, .14, .35); return 1.05; },
  kingfisher: (t, d) => { for (let i = 0; i < 10; i++) { const f = 3300 - i * 120; tone(d, t + i * .075, f, f * .85, .06, .12, 'triangle'); } return .75; },
};
function play(b, now) {
  const ac = audio.ac, g = ac.createGain(), pan = ac.createStereoPanner();
  pan.pan.value = (b.x / W * 2 - 1) * .8; g.gain.value = .8; g.connect(pan).connect(audio.master);
  let dur;
  const list = audio.files[b.sp], buf = list && list[Math.random() * list.length | 0];
  if (buf) { const s = ac.createBufferSource(); s.buffer = buf; s.connect(g); s.start(); dur = buf.duration; }
  else dur = SONGS[b.sp](ac.currentTime + .02, g);
  b.gain = g; b.songEnd = now + dur + .05; audio.voicesUntil = Math.max(audio.voicesUntil, b.songEnd + .3);
}
function hush(b) { if (b.gain) { b.gain.gain.setTargetAtTime(0, audio.ac.currentTime, .03); b.gain = null; } b.songEnd = 0; }
// רחש כנפיים בהמראה
function flutter(x) {
  if (!audio.ac) return;
  const wings = audio.files.wings;
  if (wings) {   // הקלטה אמיתית
    const ac = audio.ac, s = ac.createBufferSource(), g = ac.createGain(), pan = ac.createStereoPanner();
    s.buffer = wings[Math.random() * wings.length | 0]; s.playbackRate.value = .9 + Math.random() * .25;
    g.gain.value = .45; pan.pan.value = (x / W * 2 - 1) * .8;
    s.connect(g).connect(pan).connect(audio.master); s.start(); return;
  }
  const ac = audio.ac, s = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain(), pan = ac.createStereoPanner(), t = ac.currentTime;
  s.buffer = audio.noise; bp.type = 'bandpass'; bp.frequency.value = 900 + Math.random() * 500; bp.Q.value = .8;
  g.gain.setValueAtTime(0, t);
  for (let i = 0; i < 12; i++) { g.gain.linearRampToValueAtTime(.25, t + i * .05 + .01); g.gain.linearRampToValueAtTime(.02, t + i * .05 + .04); }
  g.gain.linearRampToValueAtTime(0, t + .65);
  pan.pan.value = (x / W * 2 - 1) * .8;
  s.connect(bp).connect(g).connect(pan).connect(audio.master); s.start(t); s.stop(t + .7);
}

// ================= מיקרופון =================
// echoCancellation נשאר דלוק: הוא מנסה להוריד מהמיקרופון את מה שהעמוד עצמו משמיע, כלומר את הציפורים.
// noiseSuppression ו-autoGainControl כבויים, אחרת הדפדפן "ממלא" את השקט ומשטיח את הרעש.
const mic = { ok: false, analyser: null, buf: null, db: -100, lvl: -100, floor: null, cal: [], calUntil: 0, error: '' };
async function startAudio() {
  const ac = audio.ac = new (window.AudioContext || window.webkitAudioContext)();
  audio.master = ac.createGain(); audio.master.gain.value = .9; audio.master.connect(ac.destination);
  audio.noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const nd = audio.noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const load = (id, name) => fetch(`birds/${name}.mp3`).then(r => r.ok ? r.arrayBuffer() : Promise.reject())
    .then(b => ac.decodeAudioData(b)).then(buf => (audio.files[id] ||= []).push(buf)).catch(() => {});
  for (const id of [...Object.keys(SPECIES), 'wings']) {
    load(id, id);
    for (let i = 1; i <= 6; i++) load(id, `${id}-${i}`);
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } });
    mic.analyser = ac.createAnalyser(); mic.analyser.fftSize = 2048; ac.createMediaStreamSource(stream).connect(mic.analyser);
    mic.buf = new Float32Array(mic.analyser.fftSize); mic.ok = true; calibrate();
  } catch (e) { mic.error = e.name || String(e); }
}
function calibrate() { mic.cal = []; mic.calUntil = clockNow() + CAL_SECONDS; }
function measure(dt, now) {
  if (!mic.ok) return;
  mic.analyser.getFloatTimeDomainData(mic.buf);
  let s = 0; for (let i = 0; i < mic.buf.length; i++) s += mic.buf[i] * mic.buf[i];
  mic.db = 10 * Math.log10(s / mic.buf.length + 1e-12);
  mic.lvl = mic.db > mic.lvl ? mic.db : mic.lvl + (mic.db - mic.lvl) * Math.min(1, dt * 3);   // עלייה מיידית, ירידה איטית
  if (now < mic.calUntil) { mic.cal.push(mic.db); return; }
  if (mic.cal.length) { mic.cal.sort((a, b) => a - b); mic.floor = mic.cal[mic.cal.length >> 1]; mic.cal = []; }
  if (mic.floor != null && mic.lvl < mic.floor) mic.floor += (mic.lvl - mic.floor) * dt * .5;   // החדר נעשה שקט יותר: הרצפה יורדת איתו
}

// ================= שקט =================
let silence = 0, medCool = 0;
const sim = { small: false, med: false, loud: false };   // רעש מדומה מהמקלדת, לבדיקה בלי מיקרופון
function excessDb() {
  let e = (mic.ok && mic.floor != null) ? mic.lvl - mic.floor : 0;
  if (sim.small) e = Math.max(e, T_SMALL + 2); if (sim.med) e = Math.max(e, T_MED + 4); if (sim.loud) e = Math.max(e, T_LOUD + 10);
  return e;
}
function updateSilence(dt, now) {
  if (mic.ok && mic.floor == null) return;   // עדיין מכיילים
  const o = OFFSET + (now < audio.voicesUntil ? VOICE_GATE : 0), e = excessDb();
  medCool -= dt;
  if (e < T_SMALL + o) silence += dt;
  else if (e < T_MED + o) { /* השקט נעצר */ }
  else if (e < T_LOUD + o) { if (medCool <= 0) { silence *= .5; medCool = 1.5; } }
  else silence = 0;
  for (const b of birds) {
    const want = silence >= b.arrive * PACE;
    if (want && b.state === 'gone') startArrive(b);
    else if (!want && (b.state === 'perched' || b.state === 'arriving')) startFlee(b, Math.random() * .15);
  }
}

// ================= ציור =================
function draw() {
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = WIRE; ctx.lineWidth = Math.max(1.5, 1.6 * U); ctx.beginPath();
  for (let x = -10; x <= W + 10; x += 8) x === -10 ? ctx.moveTo(x, wireY(x)) : ctx.lineTo(x, wireY(x));
  ctx.stroke();
  for (const b of birds) if (b.state !== 'gone') drawBird(b);
}
function updateDebug() {
  const d = document.getElementById('debug'); if (d.style.display !== 'block') return;
  const present = birds.filter(b => b.state === 'perched').map(b => SPECIES[b.sp].name).join(' ');
  d.textContent = [
    mic.ok ? `mic  level ${mic.lvl.toFixed(1)} dB   floor ${mic.floor == null ? 'calibrating…' : mic.floor.toFixed(1)}   excess ${excessDb().toFixed(1)}` : `no mic (${mic.error || 'not started'}) — N / M / Space = noise`,
    `thresholds +${T_SMALL + OFFSET} / +${T_MED + OFFSET} / +${T_LOUD + OFFSET} dB   offset ${OFFSET}   pace ${PACE}`,
    `silence ${silence.toFixed(1)} s   birds: ${present}`,
    `keys: D debug · C calibrate · [ ] offset · F fullscreen · N/M/Space noise`,
  ].join('\n');
}

// ================= לולאה =================
let last = clockNow();
function frame() {
  const now = clockNow(), dt = Math.min(.05, now - last); last = now;
  measure(dt, now); updateSilence(dt, now);
  birds.forEach(b => updateBird(b, dt, now));
  updateWire(dt); draw(); updateDebug();
  requestAnimationFrame(frame);
}

// ================= הפעלה ומקשים =================
let started = false;
document.getElementById('start').addEventListener('click', async e => {
  e.currentTarget.remove(); document.body.classList.add('run');
  document.documentElement.requestFullscreen?.().catch(() => {});
  await startAudio(); started = true;
});
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'd') { const d = document.getElementById('debug'); d.style.display = d.style.display === 'block' ? 'none' : 'block'; }
  if (k === 'f') document.documentElement.requestFullscreen?.();
  if (k === 'c') calibrate();
  if (k === '[') OFFSET -= 2; if (k === ']') OFFSET += 2;
  if (k === 'n') sim.small = true; if (k === 'm') sim.med = true; if (e.code === 'Space') { sim.loud = true; e.preventDefault(); }
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'n') sim.small = false; if (k === 'm') sim.med = false; if (e.code === 'Space') sim.loud = false;
});
frame();
</script>
</body>
